[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manuscript-placeholder-collector"
version = "1.4.0"
description = "Collect unresolved notes from text, Markdown, Word, and EPUB manuscripts into a local revision checklist."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1"]
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
keywords = ["writing", "manuscript", "docx", "epub", "revision", "placeholders"]

[project.optional-dependencies]
dev = ["lxml-stubs>=0.5,<1", "build>=1.3,<2", "mypy>=1.15,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
manuscript-placeholders = "manuscript_placeholders.cli:main"

[project.urls]
Homepage = "https://github.com/loganpendragonmultiverse/manuscript-placeholder-collector"
Issues = "https://github.com/loganpendragonmultiverse/manuscript-placeholder-collector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manuscript_placeholders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
